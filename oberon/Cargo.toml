[workspace]
resolver = "2"
members = ["crates/*"]

# Pinned in one place (DESIGN §2): `lalrpop` and `lalrpop-util` must be at the
# same version, and only `syntax` may name either.
[workspace.dependencies]
lalrpop = "0.23"
lalrpop-util = { version = "0.23", features = ["lexer", "unicode"] }
cranelift-codegen = "0.136"
cranelift-frontend = "0.136"
cranelift-module = "0.136"
cranelift-native = "0.136"
cranelift-object = "0.136"
target-lexicon = "0.13"
