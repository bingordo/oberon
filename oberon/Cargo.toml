[workspace]
resolver = "2"
members = ["crates/*"]

# The LALRPOP generator lives in tools/parser-codegen; ordinary builds
# only use its lightweight runtime with the handwritten Oberon lexer.
[workspace.dependencies]
lalrpop-util = { version = "=0.23.1", default-features = false }
cranelift-codegen = "0.136"
cranelift-frontend = "0.136"
cranelift-module = "0.136"
cranelift-native = "0.136"
cranelift-object = "0.136"
target-lexicon = "0.13"
